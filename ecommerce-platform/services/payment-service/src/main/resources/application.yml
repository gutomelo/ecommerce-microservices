server:
  port: 8086

spring:
  application:
    name: payment-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5438}/${DB_NAME:payment_db}
    username: ${DB_USERNAME:payment}
    password: ${DB_PASSWORD:payment}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

platform:
  payment:
    approval-threshold: 500.00

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
