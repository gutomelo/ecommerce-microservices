server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/**
            - id: customer-service
              uri: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/customers/**
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/products/**

gateway:
  security:
    public-paths:
      - /auth/**
      - /actuator/**
  rate-limit:
    limit-for-period: 20
    limit-refresh-period-millis: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
